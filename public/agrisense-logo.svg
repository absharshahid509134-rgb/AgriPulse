<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Vibrant Agriculture Green -->
  <rect width="512" height="512" rx="64" fill="#15803D" />
  
  <!-- Subtle inner gradient highlight -->
  <radialGradient id="agriGlow" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#22C55E" stop-opacity="0.25" />
    <stop offset="100%" stop-color="#15803D" stop-opacity="0" />
  </radialGradient>
  <rect width="512" height="512" rx="64" fill="url(#agriGlow)" />

  <!-- Center Three-Leaf Sprout & Water Lines in Warm Cream (#F7F5EA) -->
  <g fill="#F7F5EA" stroke="#F7F5EA">
    <!-- Center Leaf (Vertical Teardrop Sprout) -->
    <path 
      d="M256,76 C256,76 202,175 202,254 C202,306 226,334 256,334 C286,334 310,306 310,254 C310,175 256,76 256,76 Z" 
      fill="#F7F5EA"
      stroke="none"
    />
    <!-- Center Leaf Inner Vein & Terminal Node (Carved Green) -->
    <path 
      d="M256,324 C256,324 256,238 256,192" 
      stroke="#15803D" 
      stroke-width="12" 
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="256" cy="180" r="14" fill="#15803D" stroke="none" />

    <!-- Left Leaf (Arched to the left) -->
    <path 
      d="M236,330 C236,330 148,348 80,306 C24,272 26,206 72,192 C148,168 226,260 236,330 Z" 
      fill="#F7F5EA"
      stroke="none"
    />
    <!-- Left Leaf Inner Vein & Node (Carved Green) -->
    <path 
      d="M220,314 C176,276 142,246 114,232" 
      stroke="#15803D" 
      stroke-width="11" 
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="106" cy="228" r="13" fill="#15803D" stroke="none" />

    <!-- Right Leaf (Arched to the right) -->
    <path 
      d="M276,330 C276,330 364,348 432,306 C488,272 486,206 440,192 C364,168 286,260 276,330 Z" 
      fill="#F7F5EA"
      stroke="none"
    />
    <!-- Right Leaf Inner Vein & Node (Carved Green) -->
    <path 
      d="M292,314 C336,276 370,246 398,232" 
      stroke="#15803D" 
      stroke-width="11" 
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="406" cy="228" r="13" fill="#15803D" stroke="none" />

    <!-- Flowing Water Wave 1 (Upper Wave) -->
    <path 
      d="M104,364 C140,352 176,378 214,378 C252,378 288,352 326,352 C364,352 400,378 436,368" 
      fill="none" 
      stroke="#F7F5EA" 
      stroke-width="14" 
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Flowing Water Wave 2 (Lower Wave) -->
    <path 
      d="M104,404 C140,392 176,418 214,418 C252,418 288,392 326,392 C364,392 400,418 436,408" 
      fill="none" 
      stroke="#F7F5EA" 
      stroke-width="14" 
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
